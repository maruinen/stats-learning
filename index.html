<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統計学学習ツール</title>
    <link rel="stylesheet" href="style.css?v=20261003-1">
</head>
<body>
    <div class="container">
        <h1>統計学学習ツール</h1>
        <p class="page-introduction">学習したい項目を選び、カードで答えを思い出してください。</p>
        <p class="study-mode-links"><a id="sequential-mode-link" class="btn" href="sequential.html?new=1">全カードを順番に学ぶ</a></p>

        <div class="filter-bar">
            <label for="search-input">キーワード</label>
            <input id="search-input" type="search" placeholder="例: 因子分析、信頼区間、正規分布">
            <label for="category-filter">カテゴリ</label>
            <select id="category-filter">
                <option value="all">すべてのカテゴリ</option>
            </select>
        </div>

        <p id="status-message" class="status-message" aria-live="polite">学習データを読み込んでいます。</p>
        <main id="item-list"></main>
    </div>

    <script type="module" src="assets/js/index-page.js"></script>
</body>
</html>
